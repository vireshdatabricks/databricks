name: Deploy PBM Case Insight Backend

on:
  push:
    branches:
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/pbmcaseinsight-backend.yaml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/pbmcaseinsight-backend.yaml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  packages: read

env:
  REGISTRY_NAME: pbmaipocsnonprodcusacr
  REGISTRY_LOGIN_SERVER: pbmaipocsnonprodcusacr.azurecr.io
  IMAGE_NAME: pbmcaseinsight-be
  RESOURCE_GROUP: pbm-ai-pocs-nonprod-cus-rg
  CONTAINER_APP_NAME: pbm-ai-pocs-np-caseinsight-be
  ACA_ENVIRONMENT: pbm-ai-pocs-non-prod-cus-cae
  DOCKERFILE_PATH: ./backend/Dockerfile
  CONTEXT_PATH: .
  PORT: 8000

jobs:
  build-and-push:
    name: Build & Push image
    runs-on: uhg-runner
    # PRs only build (no push/deploy); direct pushes to master build, push, and deploy.
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ env.REGISTRY_NAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to UHG internal registry
        uses: docker/login-action@v3
        with:
          registry: edgeinternal1uhg.optum.com
          username: ${{ secrets.UHG_REGISTRY_USERNAME }}
          password: ${{ secrets.UHG_REGISTRY_PASSWORD }}

      - name: Build & push (with BuildKit secrets)
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.CONTEXT_PATH }}
          file: ${{ env.DOCKERFILE_PATH }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          secrets: |
            "jf-user=${{ secrets.UHG_REGISTRY_USERNAME }}"
            "jf-token=${{ secrets.UHG_REGISTRY_PASSWORD }}"

  deploy:
    name: Deploy to Azure Container Apps
    needs: build-and-push
    runs-on: uhg-runner
    # Deploy only on direct pushes; PR builds stop after build-and-push.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDS }}

      - name: Deploy to ACA (existing app)
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.RESOURCE_GROUP }}
          containerAppName: ${{ env.CONTAINER_APP_NAME }}
          imageToDeploy: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          acrName: ${{ env.REGISTRY_NAME }}
